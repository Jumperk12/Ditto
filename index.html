<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DITTO - 4K K-Pop Wallpapers</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FFEBF3 0%, #F5CEE8 100%);
            color: #4A1535;
            display: flex;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            max-width: 450px;
            padding: 40px 24px;
            margin: auto;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(230, 40, 120, 0.15);
        }
        h1 {
            font-size: 42px;
            margin: 0 0 10px 0;
            background: linear-gradient(45deg, #EC2F7B, #9B30A8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 15px;
            color: #8A3B6E;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            padding: 10px 20px;
            background: #EC2F7B;
            color: white;
            font-weight: bold;
            border-radius: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>DITTO</h1>
        <p>100% Light Pink Y2K 4K K-Pop Wallpapers for iPhone</p>
        <div class="badge">Coming Soon to App Store ✨</div>
    </div>
</body>
</html>
