<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DITTO - 4K K-Pop Wallpapers</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
        }

        /* Fullscreen Animated Background Video */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Glassmorphic Overlay Card */
        .overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 400px;
            padding: 24px 20px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(220, 30, 110, 0.25);
            text-align: center;
            color: #fff;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ffffff, #ffd1ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 18px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .badge {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #ec2f7b, #9b30a8);
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            border-radius: 24px;
            box-shadow: 0 4px 15px rgba(236, 47, 123, 0.4);
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .badge:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Video Element playing launch.mp4 in a loop -->
    <div class="video-container">
        <video autoplay loop muted playsinline preload="auto">
            <source src="launch.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Aesthetic Glass Overlay -->
    <div class="overlay">
        <h1>DITTO</h1>
        <p>100% Light Pink 4K K-Pop Wallpapers</p>
        <span class="badge">✨ Coming Soon to App Store</span>
    </div>

</body>
</html>
