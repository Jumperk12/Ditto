<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DITTO - 4K K-Pop Wallpapers</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #FFEBF3 url('background.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Fullscreen Animated Background Video */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Glassmorphic Overlay Card */
        .overlay {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 420px;
            padding: 28px 24px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 15px 35px rgba(220, 30, 110, 0.2);
            text-align: center;
        }

        h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #ec2f7b, #9b30a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 14px;
            font-weight: 700;
            color: #7A2855;
            margin-bottom: 18px;
        }

        .badge {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #ec2f7b, #9b30a8);
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            border-radius: 24px;
            box-shadow: 0 4px 15px rgba(236, 47, 123, 0.4);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Video Element playing launch.mp4 in a loop -->
    <div class="video-container">
        <video autoplay loop muted playsinline preload="auto">
            <source src="launch.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Aesthetic Glass Overlay -->
    <div class="overlay">
        <h1>DITTO</h1>
        <p>100% Light Pink 4K K-Pop Wallpapers</p>
        <span class="badge">✨ Coming Soon to App Store</span>
    </div>

</body>
</html>
